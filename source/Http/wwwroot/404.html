<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - 页面未找到</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* ----- 替换为图片背景（相对于 404.html 的路径） ----- */
            background: #1a2332 url('../img/good.png') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            position: relative;
        }

        /* ===== 动态粒子背景 ===== */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0.4);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        /* ===== 主卡片 ===== */
        .error-container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 48px 40px 56px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            max-width: 580px;
            width: 90%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .error-container:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
        }

        /* ===== 404 大标题 ===== */
        .error-code {
            font-size: 128px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            filter: drop-shadow(0 8px 24px rgba(245, 87, 108, 0.25));
            margin-bottom: 8px;
            user-select: none;
        }

        .error-badge {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .error-title {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .error-desc {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.7;
            margin-bottom: 36px;
            font-weight: 400;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 34px;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            border: none;
            outline: none;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #0b1120;
            box-shadow: 0 8px 28px rgba(79, 172, 254, 0.35);
        }

        .btn-primary:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 40px rgba(79, 172, 254, 0.5);
        }

        .btn-primary:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.25);
            transform: scale(1.04);
        }

        .btn-secondary:active {
            transform: scale(0.96);
        }

        .btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .error-footer {
            margin-top: 36px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.3px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 24px;
        }

        .error-footer a {
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            transition: color 0.2s;
        }

        .error-footer a:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .error-container {
                padding: 32px 20px 40px;
                border-radius: 32px;
            }

            .error-code {
                font-size: 80px;
            }

            .error-title {
                font-size: 22px;
            }

            .error-desc {
                font-size: 14px;
                padding: 0 4px;
            }

            .btn {
                padding: 12px 26px;
                font-size: 14px;
                width: 100%;
                justify-content: center;
            }

            .button-group {
                flex-direction: column;
                width: 100%;
            }

            .error-badge {
                font-size: 12px;
                padding: 4px 16px;
            }
        }

        @media (max-width: 380px) {
            .error-code {
                font-size: 64px;
            }

            .error-title {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== 粒子背景容器 ===== -->
    <div class="particles" id="particles"></div>

    <!-- ===== 主内容 ===== -->
    <main class="error-container" role="main">
        <div class="error-code">404</div>
        <div class="error-badge">⏳ 迷路了</div>
        <h1 class="error-title">哎呀，页面失踪了</h1>
        <p class="error-desc">
            你访问的页面可能已被移动、删除，或者暂时不可用。<br />
            不过别担心，我们可以带你回到安全的地方。
        </p>

        <div class="button-group">
            <a href="/" class="btn btn-primary">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                返回首页
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary">
                <svg viewBox="0 0 24 24">
                    <path d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                返回上一页
            </a>
        </div>

        <div class="error-footer">
            <span>— 或许你想去 <a href="/sitemap">网站地图</a> 看看 —</span>
        </div>
    </main>

    <script>
        // ===== 动态粒子生成 =====
        (function createParticles() {
            const container = document.getElementById('particles');
            if (!container) return;
            const count = Math.min(60, Math.floor(window.innerWidth / 20) + 20);
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = 3 + Math.random() * 6;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                const duration = 12 + Math.random() * 16;
                particle.style.animationDuration = duration + 's';
                const delay = Math.random() * 20;
                particle.style.animationDelay = delay + 's';
                const opacity = 0.08 + Math.random() * 0.22;
                particle.style.background = `rgba(255, 255, 255, ${opacity})`;
                fragment.appendChild(particle);
            }
            container.appendChild(fragment);
        })();

        // ===== 键盘快捷键：按 H 回首页 =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                if (!e.ctrlKey && !e.metaKey && !e.altKey) {
                    window.location.href = '/';
                }
            }
        });
    </script>

</body>

</html>
