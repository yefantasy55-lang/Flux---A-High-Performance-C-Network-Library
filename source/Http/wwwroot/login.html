<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户登录</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, .15);
    }

    h1 {
      font-size: 24px;
      text-align: center;
      color: #333;
      margin-bottom: 8px;
    }

    .sub {
      text-align: center;
      color: #999;
      font-size: 13px;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
    }

    input[type=text],
    input[type=password] {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input[type=text]:focus,
    input[type=password]:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, .15);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #666;
      margin-bottom: 22px;
    }

    .row label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity .2s;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }

    .msg.err {
      color: #e74c3c;
    }

    .msg.ok {
      color: #27ae60;
    }

    .foot {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-top: 22px;
    }

    .foot a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>欢迎回来</h1>
    <p class="sub">登录你的账号以继续</p>

    <form id="loginForm" action="#" method="post" novalidate>
      <div class="field">
        <label for="username">用户名 / 邮箱</label>
        <input type="text" id="username" name="username" placeholder="请输入用户名或邮箱" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password"
          required>
      </div>
      <div class="row">
        <label><input type="checkbox" id="remember" name="remember" value="1"> 记住我</label>
      </div>
      <button type="submit" id="submitBtn">登 录</button>
      <p class="msg" id="msg"></p>
    </form>

    <p class="foot">还没有账号？<a href="register.html">立即注册</a></p>
  </div>

  <script>
    var form = document.getElementById('loginForm');
    var msg = document.getElementById('msg');
    var btn = document.getElementById('submitBtn');
    var elUser = document.getElementById('username');
    var elPass = document.getElementById('password');
    var elRemember = document.getElementById('remember');

    function show(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + (type || '');
    }

    // 回填记住的用户名
    var remembered = localStorage.getItem('rememberedUser');
    if (remembered) {
      elUser.value = remembered;
      elRemember.checked = true;
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault(); // 阻止默认提交，改用 JS 处理

      var data = Object.fromEntries(new FormData(form).entries());
      if (!data.username || !data.username.trim()) return show('请输入用户名', 'err');
      if (!data.password) return show('请输入密码', 'err');

      btn.disabled = true;
      btn.textContent = '登录中...';

      // 模拟后端验证（从 localStorage 读取注册用户）
      setTimeout(function () {
        var users = JSON.parse(localStorage.getItem('users') || '[]');
        var user = users.find(function (u) {
          return (u.username === data.username || u.email === data.username)
            && u.password === data.password;
        });

        if (!user) {
          btn.disabled = false;
          btn.textContent = '登 录';
          return show('用户名或密码错误', 'err');
        }

        if (data.remember) localStorage.setItem('rememberedUser', data.username);
        else localStorage.removeItem('rememberedUser');

        // 保存登录状态
        sessionStorage.setItem('currentUser', JSON.stringify({
          username: user.username,
          email: user.email
        }));

        show('登录成功，正在跳转...', 'ok');
        setTimeout(function () { location.href = 'index.html'; }, 800);
      }, 600);
    });
  </script>
</body>

</html>
